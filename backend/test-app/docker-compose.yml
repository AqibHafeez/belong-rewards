# One-command demo:  docker compose up --build
# API:      http://localhost:3000
# Swagger:  http://localhost:3000/docs
# Health:   http://localhost:3000/health
#
# Demo login (password: Test@1234):
#   alice@belong.com | bob@belong.com | test@belong.com
# Admin header: X-Admin-Key: demo-admin-key-change-in-production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: belong
      POSTGRES_PASSWORD: belong_dev
      POSTGRES_DB: fan_rewards
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U belong -d fan_rewards']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    profiles:
      - test
    environment:
      POSTGRES_USER: belong
      POSTGRES_PASSWORD: belong_dev
      POSTGRES_DB: fan_rewards_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U belong -d fan_rewards_test']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env.example
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: belong
      DB_PASSWORD: belong_dev
      DB_DATABASE: fan_rewards
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: demo-access-secret-change-in-production
      JWT_REFRESH_SECRET: demo-refresh-secret-change-in-production
      ADMIN_API_KEY: demo-admin-key-change-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: info
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        echo "==> Running database migrations..."
        npm run migration:run
        echo "==> Seeding database (idempotent)..."
        npm run seed
        echo "==> Starting API..."
        exec npm run dev
    restart: unless-stopped

volumes:
  pgdata:
